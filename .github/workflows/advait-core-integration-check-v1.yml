name: Advait Core Integration Check v1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: advait-core-integration-check-v1
  cancel-in-progress: false

jobs:
  integration:
    name: ATC plan to verified local worker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run complete unit test suite
        run: python -m unittest discover -v
      - name: Compile core, tests and scripts
        run: python -m compileall -q core tests scripts
      - name: Run zero-API end-to-end integration
        run: python scripts/advait_atc_worker_bridge_v1.py
