name: Advait AI Developer v1 CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [advait-governed-ai-developer-v1-2026-11-27]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Unit tests
        run: python -m unittest discover -v
      - name: Compile
        run: python -m compileall -q core tests scripts
