name: ATC local test suite
on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - name: Verify pinned B2B submodule
        run: git submodule status
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run unit tests
        run: python -m unittest discover -v
      - name: Compile core, tests and scripts
        run: python -m compileall -q core tests scripts
      - name: Run zero-network B2B integration smoke
        run: python scripts/advait_b2b_integration_smoke_v1.py
