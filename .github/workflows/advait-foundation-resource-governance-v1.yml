name: Advait Foundation Resource Governance v1
on:
  pull_request:
    branches: [main]
  push:
    branches: [advait-foundation-resource-governance-v1-2026-11-27]
permissions:
  contents: read
jobs:
  foundation-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Foundation lifecycle tests
        run: python -m unittest discover -s tests -p 'test_foundation_resource_governance_v1.py' -v
      - name: Full regression suite
        run: python -m unittest discover -v
      - name: Compile
        run: python -m compileall -q core tests scripts
