name: Legacy TaskQueue lifecycle regression

on:
  pull_request:
    paths:
      - "core/task_queue.py"
      - "core/provider_router_v1.py"
      - "core/managed_sqlite_v1.py"
      - "tests/**"
      - ".github/workflows/legacy-task-queue-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy-task-queue-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run full test suite
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q core tests
