name: Advait Repository Vetting v1

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Public GitHub repository owner/name"
        required: true
        type: string
        default: "reubano/meza"

permissions:
  contents: read

concurrency:
  group: advait-repository-vetting-v1
  cancel-in-progress: false

jobs:
  vet:
    name: Read-only dependency and risk triage
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run full unit test suite
        run: python -m unittest discover -v
      - name: Compile Advait modules
        run: python -m compileall -q core tests scripts
      - name: Inspect public repository root files only
        env:
          TARGET_REPOSITORY: ${{ inputs.repository }}
        run: |
          python scripts/advait_vet_repository_v1.py --repo "$TARGET_REPOSITORY" \
            | tee "$RUNNER_TEMP/advait-repository-vetting.json"
      - name: Upload vetting report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: advait-repository-vetting-report
          path: ${{ runner.temp }}/advait-repository-vetting.json
          if-no-files-found: ignore
          retention-days: 7
